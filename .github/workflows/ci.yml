name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Formato, análisis y pruebas
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: devconnect_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/devconnect_test?sslmode=disable

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Formato (gofmt)
        run: |
          sin_formato=$(gofmt -l .)
          if [ -n "$sin_formato" ]; then
            echo "Estos archivos no tienen formato gofmt:"
            echo "$sin_formato"
            exit 1
          fi

      - name: Análisis estático (go vet)
        run: go vet ./...

      - name: Compilar
        run: go build ./...

      - name: Pruebas (con detector de condiciones de carrera)
        run: go test -race -count=1 ./...
